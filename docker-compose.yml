version: '3.8'

services:
  cdai-crohns-disease-activity:
    build: .
    container_name: cdai-crohns-disease-activity
    ports:
      - "8000:8000"
    environment:
      - AUDIT_SECRET_KEY=cdai-crohns-disease-activity-prod-audit-key-2026
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
