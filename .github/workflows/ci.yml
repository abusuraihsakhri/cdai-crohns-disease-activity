name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile Python sources
        run: python -m compileall -q cdai_crohns.py cli.py
      - name: Run Python tests
        run: python -m pytest -q
      - name: Run CLI smoke test
        run: python cli.py batch --input sample.csv --output out_smoke.csv

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test browser calculation module
        run: node tests/test_web.js
      - name: Check static app entry point
        run: test -s web/index.html && test -s web/calculator.js
